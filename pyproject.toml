[project]
name = "alebrijes"
version = "0.1.0"
description = "Local, multi-voice book-to-audiobook engine: cloned voices cast to characters via rule-based speaker attribution."
readme = "README.md"
requires-python = ">=3.10"
authors = [
  { name = "Contributors" }
]
dependencies = [
  "pocket-tts",
  "scipy",
  "numpy",
  "pypdf",
  "rich",
  "pyyaml",
  "spacy",
  "soundfile",  # pocket-tts needs this to read non-WAV audio (mp3/m4a/etc. voice clones)
  "fastapi",
  "uvicorn[standard]",
  "pywebview",
  "imageio-ffmpeg",  # bundles a real static ffmpeg binary -- no system install needed
]

[project.optional-dependencies]
dev = [
  "pytest",
  "reportlab",  # generates tiny real PDFs for ingest.pdf tests only
  "httpx",  # required by fastapi.testclient.TestClient
]

[project.scripts]
alebrijes = "alebrijes.cli:main"
alebrijes-gui = "alebrijes.gui:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
alebrijes = ["frontend/*.html"]
